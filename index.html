        let isSubmittingCustomReq = false;

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Enviando...</span>`;
            }
            isSubmittingCustomReq = true;
        }

        function handleFormResponse() {
            if (!isSubmittingCustomReq) return;
            
            showNotification('¡Solicitud enviada con éxito! La guardamos en nuestra planilla.');
            
            const form = document.getElementById('custom-request-form');
            if (form) form.reset();

            const btn = document.getElementById('btn-submit-req');
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>Enviar Solicitud Privada</span>`;
            }

            isSubmittingCustomReq = false;
        }

        updateCartUI();
